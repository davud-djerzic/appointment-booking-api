services:
  postgres:
    image: postgres:18
    container_name: appointment-booking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

      - ./AppointmentBooking.Api/Database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./AppointmentBooking.Api/Database/002_employee_services_status.sql:/docker-entrypoint-initdb.d/002_employee_services_status.sql:ro
      - ./AppointmentBooking.Api/Database/003_employee_working_hours.sql:/docker-entrypoint-initdb.d/003_employee_working_hours.sql:ro
      - ./AppointmentBooking.Api/Database/004_bookings_and_appointments.sql:/docker-entrypoint-initdb.d/004_bookings_and_appointments.sql:ro
      - ./AppointmentBooking.Api/Database/005_user_refresh_tokens.sql:/docker-entrypoint-initdb.d/005_user_refresh_tokens.sql:ro
      - ./AppointmentBooking.Api/Database/006_seed.sql:/docker-entrypoint-initdb.d/006_seed.sql:ro
      - ./AppointmentBooking.Api/Database/007_add_refresh_token_family.sql:/docker-entrypoint-initdb.d/007_add_refresh_token_family.sql:ro
      - ./AppointmentBooking.Api/Database/008_add_appointment_service_snapshot.sql:/docker-entrypoint-initdb.d/008_add_appointment_service_snapshot.sql:ro
      - ./AppointmentBooking.Api/Database/009_add_completion_source_to_booking.sql:/docker-entrypoint-initdb.d/009_add_completion_source_to_booking.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  api:
    build:
      context: .
      dockerfile: AppointmentBooking.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
	
       Jwt__SecretKey: ${JWT_SECRET_KEY}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: appointment-booking-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
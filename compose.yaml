services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./AppointmentBooking.Api/Database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./AppointmentBooking.Api/Database/002_employee_services_status.sql:/docker-entrypoint-initdb.d/002_employee_services_status.sql:ro
      - ./AppointmentBooking.Api/Database/003_employee_working_hours.sql:/docker-entrypoint-initdb.d/003_employee_working_hours.sql:ro
      - ./AppointmentBooking.Api/Database/004_bookings_and_appointments.sql:/docker-entrypoint-initdb.d/004_bookings_and_appointments.sql:ro
      - ./AppointmentBooking.Api/Database/005_user_refresh_tokens.sql:/docker-entrypoint-initdb.d/005_user_refresh_tokens.sql:ro
      - ./AppointmentBooking.Api/Database/006_add_refresh_token_family.sql:/docker-entrypoint-initdb.d/006_add_refresh_token_family.sql:ro
      - ./AppointmentBooking.Api/Database/007_add_appointment_service_snapshot.sql:/docker-entrypoint-initdb.d/007_add_appointment_service_snapshot.sql:ro
      - ./AppointmentBooking.Api/Database/008_add_completion_source_to_booking.sql:/docker-entrypoint-initdb.d/008_add_completion_source_to_booking.sql:ro
      - ./AppointmentBooking.Api/Database/009_add_salons.sql:/docker-entrypoint-initdb.d/009_add_salons.sql:ro
      - ./AppointmentBooking.Api/Database/010_add_password_reset_codes.sql:/docker-entrypoint-initdb.d/010_add_password_reset_codes.sql:ro
      - ./AppointmentBooking.Api/Database/011_employee_unavailability.sql:/docker-entrypoint-initdb.d/011_employee_unavailability.sql:ro
      - ./AppointmentBooking.Api/Database/012_employee_walk_in_bookings.sql:/docker-entrypoint-initdb.d/012_employee_walk_in_bookings.sql:ro
      - ./AppointmentBooking.Api/Database/013_add_phone_to_salons.sql:/docker-entrypoint-initdb.d/013_add_phone_to_salons.sql:ro
      - ./AppointmentBooking.Api/Database/014_seed.sql:/docker-entrypoint-initdb.d/014_seed.sql:ro
      - ./AppointmentBooking.Api/Database/015_services_unique_active_name.sql:/docker-entrypoint-initdb.d/015_services_unique_active_name.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: AppointmentBooking.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Mailjet__SecretKey: ${MAILJET_SECRET_KEY:-}
      Mailjet__FromName: ${MAILJET_FROM_NAME:-}
      Mailjet__FromEmail: ${MAILJET_FROM_EMAIL:-}
      Mailjet__ApiKey: ${MAILJET_API_KEY:-}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
